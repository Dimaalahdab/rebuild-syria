        volunteering: { type: array, items: { $ref: "#/components/schemas/Membership" } }
        notifications: { $ref: "#/components/schemas/UserNotifications" }
      required: [reports, volunteering, notifications]
    MunicipalityDashboard:
      type: object
      properties:
        reports: { type: array, items: { $ref: "#/components/schemas/Report" } }
        applications: { type: array, items: { $ref: "#/components/schemas/Membership" } }
        pendingProjects: { type: array, items: { $ref: "#/components/schemas/Project" } }
        counters:
          type: object
          properties:
            reportsByStatus: { type: object, additionalProperties: { type: integer } }
            pendingApplications: { type: integer }
            averageDecisionHours: { type: [number, "null"] }
          required: [reportsByStatus, pendingApplications, averageDecisionHours]
      required: [reports, applications, pendingProjects, counters]
