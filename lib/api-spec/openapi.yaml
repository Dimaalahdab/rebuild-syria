        userName: { type: string }
        city: { type: string }
        status: { type: string, enum: [pending, accepted, declined, confirmed] }
        municipalityNote: { type: [string, "null"] }
        projectNote: { type: [string, "null"] }
        scheduledAt: { type: [string, "null"], format: date-time }
        projectStatus: { type: string }
        updatedAt: { type: string, format: date-time }
      required: [id, projectId, projectTitle, userId, userName, city, status]
    AdminSummary:
      type: object
      properties:
        unverifiedReports:
          type: array
          items: { $ref: "#/components/schemas/Report" }
        pendingProjects:
          type: array
          items: { $ref: "#/components/schemas/Project" }
        joinedMemberships:
          type: array
          items: { $ref: "#/components/schemas/Membership" }
      required: [unverifiedReports, pendingProjects, joinedMemberships]
    AdminProjectStatusInput:
      type: object
      properties:
        status: { type: string, enum: [open, rejected] }
      required: [status]
    AppConfig:
      type: object
      properties:
        cityName: { type: string }
