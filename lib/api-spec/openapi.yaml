        cityNameEn: { type: string }
      required: [cityName, cityNameAr, cityNameEn]
    ReportDecisionInput:
      type: object
      properties:
        status: { type: string, enum: [under_review, accepted_for_volunteers, assigned_to_municipality, referred, scheduled, completed, rejected] }
        assignedTo: { type: string, enum: [volunteers, municipality, other_authority] }
        scheduledAt: { type: [string, "null"], format: date-time }
        note: { type: string, maxLength: 2000 }
      required: [status, assignedTo, note]
    ApplicationDecisionInput:
      type: object
      properties:
        status: { type: string, enum: [accepted, declined] }
        note: { type: string, maxLength: 2000 }
